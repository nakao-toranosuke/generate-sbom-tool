app:
  work_dir: ../work
  out_dir: ../out
  trivy_path: ../bin/trivy.exe
  sbom_format: spdx-json
  timeout_seconds: 1800
  max_upload_mb: 200
  allow_ext:
    - .csv
    - .xlsx
    - .xlsm
    - .zip
    - .jar
    - .war
    - .ear
  header_scan_rows: 30
  preview_rows: 20
  cleanup_workdir_on_success: false
  cleanup_workdir_on_failure: false
